<style>
/* Layout: sticky top bar with level + streak, tab rail, one working panel per mode, max 960px */
:root{
  --bg:#f4f5f9; --surface:#ffffff; --sunk:#eceef5; --line:#d9dce8;
  --fg:#161a2e; --muted:#5b6078; --accent:#2f4fd8; --accent-ink:#ffffff; --accent-soft:#e3e8fc;
  --warm:#c2540a; --warm-soft:#fbe9dc; --good:#1f8a4c; --good-soft:#e0f3e7; --bad:#c22f3a; --bad-soft:#fbe4e6;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10121c; --surface:#181b29; --sunk:#202436; --line:#2d3247;
  --fg:#e9ebf5; --muted:#9aa0bb; --accent:#7f97ff; --accent-ink:#0d1020; --accent-soft:#232c55;
  --warm:#f59a5b; --warm-soft:#3a2617; --good:#5cc98a; --good-soft:#173324; --bad:#f17a83; --bad-soft:#3b1c20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10121c; --surface:#181b29; --sunk:#202436; --line:#2d3247;
  --fg:#e9ebf5; --muted:#9aa0bb; --accent:#7f97ff; --accent-ink:#0d1020; --accent-soft:#232c55;
  --warm:#f59a5b; --warm-soft:#3a2617; --good:#5cc98a; --good-soft:#173324; --bad:#f17a83; --bad-soft:#3b1c20; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin-right:auto}
.brand span{color:var(--accent)}
.pill{font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.lvl{background:var(--accent);color:var(--accent-ink)}
.pill.fire{background:var(--warm-soft);color:var(--warm)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font:500 14px var(--body);padding:7px 12px;border-radius:8px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs button:hover{color:var(--fg)}
main{padding-block:24px 64px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.15}
h2{font-size:21px}
h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 14px var(--body);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,nav.tabs button:focus-visible,.opt:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:16px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.banner p{flex:1 1 260px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--sunk);border-radius:8px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.mission{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.mission li{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.mission li .t{flex:1;min-width:0}
.mission li .min{font-family:var(--mono);font-size:12px;color:var(--muted)}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}
.check.on{background:var(--good);border-color:var(--good)}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.it{background:var(--accent-soft);color:var(--accent)}
.tag.gen{background:var(--warm-soft);color:var(--warm)}
/* flashcard */
.card{border:1px solid var(--line);border-radius:14px;padding:28px 24px;min-height:220px;display:grid;align-content:center;gap:10px;text-align:center;background:var(--surface)}
.card .word{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.card .def{font-size:16px}
.card .ex{font-style:italic;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate .btn{display:grid;gap:2px;padding:10px 6px;text-align:center}
.rate .btn small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rate .again{border-color:var(--bad)} .rate .easy{border-color:var(--good)}
/* quiz */
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:15px var(--body);padding:11px 14px;border-radius:8px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.progressbar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--accent)}
textarea,input[type=text],select{width:100%;font:15px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:200px;resize:vertical;line-height:1.6}
label.f{display:grid;gap:6px;font-weight:500;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chips input{accent-color:var(--accent)}
.fb{display:grid;gap:12px}
.score{font-family:var(--display);font-size:40px;font-weight:700;color:var(--accent);line-height:1}
.corr{border-left:3px solid var(--warm);padding:6px 12px;display:grid;gap:2px;background:var(--sunk);border-radius:0 6px 6px 0}
.corr del{color:var(--bad)} .corr ins{color:var(--good);text-decoration:none;font-weight:600}
.chat{display:grid;gap:10px;max-height:420px;overflow-y:auto;padding:4px}
.msg{max-width:85%;padding:10px 14px;border-radius:12px;overflow-wrap:anywhere}
.msg.them{background:var(--sunk);justify-self:start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:var(--accent-ink);justify-self:end;border-bottom-right-radius:4px}
.msg .who{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.7;display:flex;gap:6px;align-items:center}
.speak{border:0;background:none;color:inherit;cursor:pointer;font-size:12px;padding:0;text-decoration:underline}
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.scen button{text-align:left;display:grid;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:14px;border-radius:10px;cursor:pointer;font:14px var(--body)}
.scen button:hover{border-color:var(--accent)}
.scen b{font-family:var(--display);font-size:16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
td.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.tablewrap{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div.zero{background:var(--line)}
.barlabels{display:flex;gap:4px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.barlabels span{flex:1;text-align:center}
.note{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;z-index:20}
.thinking{color:var(--muted);font-style:italic}
@media (prefers-reduced-motion: no-preference){.card,.panel{animation:rise .25s ease-out}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}
@media (max-width:480px){.card .word{font-size:28px}.rate .btn{font-size:13px}h1{font-size:24px}}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warm-soft);color:var(--warm)} .chip.good{background:var(--good-soft);color:var(--good)}
.good-t{color:var(--good)} .bad-t{color:var(--bad)} .warn-t{color:var(--warm)}
.stat .sub{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.reading{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:14px 16px;line-height:1.7;max-width:68ch}
.crit{display:grid;gap:6px}
.crit>div{display:grid;grid-template-columns:minmax(120px,160px) 1fr 28px;gap:10px;align-items:center;font-size:14px}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}
details.panel>summary{cursor:pointer;list-style:none}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::before{content:"▸ ";color:var(--muted)} details.panel[open]>summary::before{content:"▾ "}
details>summary{cursor:pointer}
.fs{border:0;padding:0;margin:0;display:grid;gap:8px}.fs legend{font-weight:500;font-size:14px;margin-bottom:6px}
.corr.accent{border-left-color:var(--accent)}
.card input{max-width:360px;justify-self:center;text-align:center}
ol.mission{counter-reset:none}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.words .w{font-family:var(--mono);font-size:13px;padding:3px 8px;border-radius:4px}
.words .w.ok{background:var(--good-soft);color:var(--good)} .words .w.miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline dotted}
.pron-s{font-size:24px}
.mono-mark{font-family:var(--mono);font-size:14px;color:var(--accent);overflow-wrap:anywhere}
.spark svg{display:block;max-width:100%}
.reading p:last-child{margin-bottom:0}
</style>

<script>
/* Standalone (installed app) platform layer. Replaces the Claude runtime with the
   browser's own speech APIs. No Claude features, no account sync: those return null. */
window.EG_STANDALONE=true;
(function(){
  function webTTS(){
    const ss=window.speechSynthesis;if(!ss||typeof SpeechSynthesisUtterance==="undefined")return null;
    const ORDER=["buttery","airy","glassy","rounded"];
    let stateFns=[],cancelled=false,speaking=false;
    function emit(state,reason){stateFns.forEach(f=>{try{f({state,reason})}catch(e){}})}
    function pickVoices(){
      const want=(window.EG_VARIETY==="US")?"en-US":"en-GB";
      const all=ss.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
      const norm=v=>v.lang.replace("_","-");
      const pref=all.filter(v=>norm(v)===want),rest=all.filter(v=>norm(v)!==want);
      return pref.concat(rest);
    }
    function speakOne(line,vs){return new Promise((res,rej)=>{
      const u=new SpeechSynthesisUtterance(String(line.text||""));
      const i=Math.max(0,ORDER.indexOf(line.voice||"buttery"));
      if(vs.length)u.voice=vs[i%vs.length];u.lang=u.voice?u.voice.lang:((window.EG_VARIETY==="US")?"en-US":"en-GB");
      u.rate=Math.min(1.5,Math.max(0.7,line.rate||1));
      u.onend=()=>res();u.onerror=e=>rej({code:(e&&e.error==="interrupted"||e&&e.error==="canceled")?"viewer_stopped":"unavailable",message:String(e&&e.error||"speech error")});
      ss.speak(u);
    })}
    return {
      async speak(input,opts){
        const lines=(Array.isArray(input)?input:[{text:input,...(opts||{})}]);
        ss.cancel();cancelled=false;speaking=true;emit("speaking");
        if(!ss.getVoices().length)await new Promise(r=>{ss.onvoiceschanged=r;setTimeout(r,1500)});
        const vs=pickVoices();
        try{for(const l of lines){if(cancelled)throw{code:"viewer_stopped"};await speakOne(l,vs)}speaking=false;emit("idle","completed")}
        catch(e){speaking=false;emit("idle","viewer_stopped");throw e}
      },
      stop(){cancelled=true;ss.cancel()},
      onState(f){stateFns.push(f);return()=>{stateFns=stateFns.filter(x=>x!==f)}}
    };
  }
  function webDict(){
    const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return null;
    let P=[],F=[],St=[],rec=null,stopWait=null;
    const fire=(arr,v)=>arr.forEach(f=>{try{f(v)}catch(e){}});
    const sub=(arr,f)=>{arr.push(f);return()=>{const i=arr.indexOf(f);if(i>=0)arr.splice(i,1)}};
    return {
      onPartial:f=>sub(P,f),onFinal:f=>sub(F,f),onState:f=>sub(St,f),
      start(){return new Promise((res,rej)=>{
        try{if(rec)rec.abort()}catch(e){}
        rec=new R();rec.lang="en-GB";rec.continuous=true;rec.interimResults=true;
        let ok=false;
        rec.onstart=()=>{ok=true;fire(St,{state:"listening"});res()};
        rec.onresult=ev=>{let interim="";for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fire(F,{text:r[0].transcript.trim()});else interim+=r[0].transcript}if(interim)fire(P,{text:interim.trim()})};
        rec.onerror=ev=>{const code=(ev.error==="not-allowed"||ev.error==="service-not-allowed")?"not_granted":"unavailable";if(!ok)rej({code,message:ev.error})};
        rec.onend=()=>{rec=null;fire(St,{state:"idle",reason:"stopped"});if(stopWait){stopWait();stopWait=null}};
        try{rec.start()}catch(e){rej({code:"unavailable",message:String(e)})}
      })},
      stop(){return new Promise(r=>{if(!rec)return r();stopWait=r;try{rec.stop()}catch(e){r()}setTimeout(r,3000)})}
    };
  }
  const caps={tts:webTTS(),dictation:webDict()};
  window.claude={use:n=>Promise.resolve(caps[n]||null)};
  if("serviceWorker" in navigator&&location.protocol!=="file:")window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
<script>
/* ================= CONTENT ================= */
const LEVELS=["A2","B1","B2","C1"];
const ALL_LEVELS=["A1","A2","B1","B2","C1","C2"];
const CATS=["articles","prepositions","present perfect","past tenses","tenses (other)","question formation","word order","conditionals","passive","verb patterns","countables","subject-verb agreement","collocations","linkers","vocabulary","naturalness & register","spelling & punctuation","other"];
const SKILLS=[["grammar","Grammar & vocabulary"],["reading","Reading"],["listening","Listening"],["writing","Writing"],["speaking","Speaking"]];

/* Vocabulary. Order of the first 60 items must never change: card ids are "d"+index and your review history is keyed on them.
   Fields: w, pos/cat, hu (Hungarian meaning), def, ex, track (gen|it), lvl, syn?, ant?, note? */
const DECK_RAW=[
["get the hang of","expression","ráérez, belejön","to learn how to do something after some practice","After a week I finally got the hang of the new keyboard shortcuts.","gen","B1"],
["look forward to","phrasal verb","(örömmel) vár valamit","to feel happy about something that will happen","I'm looking forward to the summer break.","gen","B1"],
["put off","phrasal verb","elhalaszt, halogat","to delay doing something","Stop putting off your thesis and write one page today.","gen","B1",{syn:"postpone, delay"}],
["figure out","phrasal verb","rájön, kitalál","to understand or solve something after thinking","I can't figure out why the test keeps failing.","gen","B1",{syn:"work out"}],
["come up with","phrasal verb","kitalál (ötletet), előáll valamivel","to think of an idea or plan","We need to come up with a name for the app.","gen","B1"],
["turn down","phrasal verb","visszautasít","to refuse an offer or request","She turned down the job because the salary was too low.","gen","B1",{syn:"reject, decline",ant:"accept"}],
["make sense","collocation","van értelme, érthető","to be clear and logical","Does this explanation make sense to you?","gen","A2"],
["take part in","collocation","részt vesz valamiben","to join an activity","Over 200 students took part in the hackathon.","gen","A2",{syn:"participate in"}],
["on the other hand","linker","másrészt","used to give a contrasting point","The city is expensive. On the other hand, the salaries are higher.","gen","B1"],
["nevertheless","linker","mindazonáltal, ennek ellenére","despite what was just said","The task was hard; nevertheless, we finished on time.","gen","B2",{syn:"however, even so"}],
["whereas","linker","míg, ezzel szemben","compares two different facts","I prefer backend work, whereas my friend loves design.","gen","B2"],
["reluctant","word","vonakodó, nem szívesen tesz valamit","not willing to do something","He was reluctant to speak English in class at first.","gen","B2",{syn:"unwilling",ant:"eager"}],
["overwhelmed","word","túlterhelt, elárasztott (érzés)","having too much to deal with","I felt overwhelmed during the exam period.","gen","B1"],
["straightforward","word","egyszerű, egyértelmű","easy to understand or do","The installation is pretty straightforward.","gen","B2",{syn:"simple",ant:"complicated"}],
["thorough","word","alapos","careful and complete","She did a thorough review of the code.","gen","B2",{syn:"careful, detailed",ant:"careless"}],
["eventually","word","végül (hosszabb idő után)","in the end, after a long time","Eventually we found the bug in the config file.","gen","B1",{note:"False friend: it does NOT mean 'esetleg'. For 'esetleg' say 'possibly' or 'maybe'."}],
["a piece of cake","idiom","gyerekjáték","something very easy","The first assignment was a piece of cake.","gen","B1"],
["break the ice","idiom","megtöri a jeget","to make people feel relaxed in a new situation","He told a joke to break the ice at the meeting.","gen","B2"],
["cut corners","idiom","összecsap valamit, a minőség rovására spórol","to do something badly to save time or money","If you cut corners on testing, users will find the bugs.","gen","B2"],
["the bottom line","idiom","a lényeg","the most important fact","The bottom line is that we need more users.","gen","C1"],
["make ends meet","idiom","kijön a pénzéből","to have just enough money to live","Many students work part-time to make ends meet.","gen","B2"],
["commute","word","ingázás; ingázik","the regular journey to work or school","My commute to the university takes 20 minutes by tram.","gen","B1"],
["take for granted","expression","természetesnek vesz","to not value something because it is always there","We take fast internet for granted.","gen","B2"],
["drawback","word","hátrány","a disadvantage","The main drawback of remote work is isolation.","gen","B2",{syn:"disadvantage, downside",ant:"advantage"}],
["inevitable","word","elkerülhetetlen","certain to happen","Some mistakes are inevitable when you learn a language.","gen","C1",{syn:"unavoidable"}],

/* ================= LEARNING LOGIC (pure functions, covered by tests) ================= */
const DAY=864e5;
function addDays(iso,n){const d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function daysBetween(a,b){return Math.round((new Date(b+"T12:00:00Z")-new Date(a+"T12:00:00Z"))/DAY)}
const lvlIdx=l=>ALL_LEVELS.indexOf(l);

/* ---- state shape + migration ---- */
function defaultState(){return{v:2,profile:null,cards:{},custom:[],mistakes:[],events:[],revStats:{},writings:[],talks:[],activity:{},tests:[],assess:[],skills:{},genItems:[],missions:{},listening:[],pron:[],started:null}}
function normalizeCat(t){
  const s=String(t||"").toLowerCase();
  if(!s)return"other";
  if(CATS.includes(s))return s;
  if(s.includes("article"))return"articles";
  if(s.includes("preposition"))return"prepositions";
  if(s.includes("present perfect")||s==="perfect")return"present perfect";
  if(s.includes("past"))return"past tenses";
  if(s.includes("question"))return"question formation";
  if(s.includes("order")||s.includes("inversion"))return"word order";
  if(s.includes("conditional")||s.includes("wish"))return"conditionals";
  if(s.includes("passive"))return"passive";
  if(s.includes("agreement")||s.includes("third person")||s.includes("subject-verb"))return"subject-verb agreement";
  if(s.includes("tense")||s.includes("future")||s.includes("continuous"))return"tenses (other)";
  if(s.includes("pattern")||s.includes("gerund")||s.includes("infinitive"))return"verb patterns";
  if(s.includes("countable")||s.includes("plural")||s.includes("quantifier"))return"countables";
  if(s.includes("collocation"))return"collocations";
  if(s.includes("linker")||s.includes("connector")||s.includes("conjunction")||s.includes("linking")||s.includes("cohesion"))return"linkers";
  if(s.includes("register")||s.includes("style")||s.includes("natural")||s.includes("formal")||s.includes("idiom")||s.includes("tone"))return"naturalness & register";
  if(s.includes("spell")||s.includes("punctu")||s.includes("capital"))return"spelling & punctuation";
  if(s.includes("vocab")||s.includes("word choice")||s.includes("false friend")||s.includes("word form")||s.includes("meaning"))return"vocabulary";
  if(s.includes("adjective"))return"prepositions";
  return"other";
}
function migrate(raw){
  const S=Object.assign(defaultState(),raw||{});
  if(!raw||raw.v===2)return S;
  // v1 -> v2
  S.v=2;
  S.mistakes=(raw.mistakes||[]).map((m,i)=>({id:"m1-"+i,d:m.d,cat:normalizeCat(m.type),src:m.src||"quiz",q:m.q||"",yours:m.yours||"",correct:m.correct||"",note:m.note||"",uses:[],fixedAt:m.fixed?(m.d||null):null,manual:!!m.fixed}));
  S.events=[];S.revStats={};S.assess=[];S.skills={};S.genItems=[];
  (raw.tests||[]).filter(t=>t.kind==="placement").forEach(t=>{
    const a={d:t.d,skill:"grammar",set:"A",score:t.score,of:t.of,level:t.level,conf:"low",note:"From the 1.0 test (20 grammar questions)"};
    S.assess.push(a);S.skills.grammar=a;
  });
  delete S.level;
  return S;
}

/* ---- spaced repetition ---- */
function rateCard(s,r,today){
  s=Object.assign({ease:2.5,interval:0,reps:0,lapses:0},s||{});
  if(r===0){s.interval=1;s.lapses++;s.ease=Math.max(1.3,s.ease-.2);s.reps=0}
  else{
    if(s.reps===0)s.interval=r===3?3:1;
    else if(s.reps===1)s.interval=r===1?2:r===2?3:6;
    else s.interval=Math.max(s.interval+1,Math.round(s.interval*(r===1?1.2:r===2?s.ease:s.ease*1.3)));
    s.ease=Math.max(1.3,s.ease+(r===1?-.15:r===3?.15:0));s.reps++;
  }
  s.due=addDays(today,s.interval);s.last=today;return s;
}
function cardStatus(s){if(!s)return"new";if(s.interval>=21)return"mastered";if(s.reps>=2&&s.interval>=7)return"review";return"learning"}
/* Daily caps: reviews come first; new cards shrink as the review load grows, so a missed day never snowballs. */
function reviewCap(minutes){return minutes>=60?70:minutes>=45?55:minutes>=30?40:25}
function newAllowance(dueCount,learningCount,minutes){
  const base=minutes>=60?12:minutes>=45?10:minutes>=30?8:5;
  if(dueCount>=reviewCap(minutes))return 0;
  if(learningCount>=40)return 0;            // too many fresh cards still unstable
  if(dueCount>25||learningCount>=25)return Math.min(3,base);
  return base;
}
function dueQueue(cardsState,deck,today,minutes){
  const due=deck.filter(c=>cardsState[c.id]&&cardsState[c.id].due<=today).sort((a,b)=>cardsState[a.id].due<cardsState[b.id].due?-1:1);
  const cap=reviewCap(minutes);
  return{now:due.slice(0,cap),waiting:Math.max(0,due.length-cap),total:due.length};
}
function retention(revStats,today,days){let n=0,ok=0;for(let k=0;k<days;k++){const r=revStats[addDays(today,-k)];if(r){n+=r.n;ok+=r.ok}}return n?ok/n:null}
function normAnswer(s){return String(s||"").toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' -]/g,"").replace(/\s+/g," ").trim()}
function checkTyped(input,target){
  const a=normAnswer(input),b=normAnswer(target);
  if(!a)return"empty";if(a===b)return"exact";
  // allow one small typo per 6 letters
  const dist=lev(a,b);return dist<=Math.max(1,Math.floor(b.length/6))?"close":"wrong";
}
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i===0?j:Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}return m[a.length][b.length]}

/* ---- mistakes: a mistake is fixed only after 3 correct uses, on 3 different items, on at least 2 different days ---- */
const MASTERY={uses:3,items:3,days:2};
function isMastered(m){
  if(m.fixedAt)return true;
  const u=m.uses||[];
  return u.length>=MASTERY.uses&&new Set(u.map(x=>x.qid)).size>=MASTERY.items&&new Set(u.map(x=>x.d)).size>=MASTERY.days;
}
function addMistake(S,m,today){
  const rec={id:"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),d:today,cat:normalizeCat(m.cat),src:m.src,q:m.q||"",qid:m.qid||null,yours:m.yours||"",correct:m.correct||"",note:m.note||"",uses:[],fixedAt:null};
